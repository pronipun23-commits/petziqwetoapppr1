<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080A" />

    <!-- 1. Primary Authority SEO Meta Tags -->
    <title>Petziq | Premium Pet & Plant Care Companion</title>
    <meta name="title" content="Petziq | Premium Pet & Plant Care Companion" />
    <meta
      name="description"
      content="Discover Petziq, the ultimate companion ecosystem unifying smart pet tracking and automated plant care. Optimize your biophilic home today."
    />
    <meta
      name="keywords"
      content="Petziq, Petziqq, smart pet tag, laser engraved pet tag, plant care app, biophilic companion, pet health tracker, plant hydration telemetry, emergency pet qr"
    />
    <meta name="author" content="Petziq Ecosystem" />
    <!-- Editorial Typography: Playfair Display + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,600;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="canonical" href="https://petziqq.com/" />

    <!-- 2. Open Graph / Facebook / WhatsApp Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Petziq" />
    <meta property="og:url" content="https://petziqq.com/" />
    <meta property="og:title" content="Petziq | Premium Pet & Plant Care Companion" />
    <meta
      property="og:description"
      content="Discover Petziq, the ultimate companion ecosystem unifying smart pet tracking and automated plant care. Optimize your biophilic home today."
    />
    <meta property="og:image" content="https://petziqq.com/petziq-shield-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Petziq - Premium Pet & Plant Care Companion" />

    <!-- 3. Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@petziq" />
    <meta name="twitter:creator" content="@petziq" />
    <meta name="twitter:url" content="https://petziqq.com/" />
    <meta name="twitter:title" content="Petziq | Premium Pet & Plant Care Companion" />
    <meta
      name="twitter:description"
      content="Discover Petziq, the ultimate companion ecosystem unifying smart pet tracking and automated plant care. Optimize your biophilic home today."
    />
    <meta name="twitter:image" content="https://petziqq.com/petziq-shield-logo.png" />

    <!-- 4. JSON-LD Structured Data Schema for Search Engines (Organization & WebSite) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://petziqq.com/#organization",
            "name": "Petziq",
            "alternateName": ["Petziqq", "Petziq Companion"],
            "url": "https://petziqq.com/",
            "logo": "https://petziqq.com/petziq-shield-logo.png",
            "sameAs": [
              "https://twitter.com/petziq",
              "https://instagram.com/petziq"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://petziqq.com/#website",
            "url": "https://petziqq.com/",
            "name": "Petziq",
            "publisher": {
              "@id": "https://petziqq.com/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://petziqq.com/explore?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
